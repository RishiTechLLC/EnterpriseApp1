# Full stack: Angular (nginx) -> .NET API -> SQL Server (schema by grate), Permify (+ Postgres) and Redis.
#   docker compose up --build
#   open http://localhost:8080
services:
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Development enables demo sign-in (/api/auth/dev-token) and seed data. Use Production + Jwt__Authority for real deployments.
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      ConnectionStrings__Database: "Server=sqlserver,1433;Database=SchoolCalendar;User Id=sa;Password=Local_Dev_Passw0rd!;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      Permify__BaseUrl: "http://permify:3476"
      Cors__AllowedOrigins__0: "http://localhost:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      permify:
        condition: service_started
      redis:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      retries: 20

  # Runs the grate migrations in db/sql, then exits. The API starts only after it succeeds.
  db-migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /repo
    volumes:
      - .:/repo:ro
    environment:
      DB_CONNECTION: "Server=sqlserver,1433;Database=SchoolCalendar;User Id=sa;Password=Local_Dev_Passw0rd!;TrustServerCertificate=True"
      DB_ENV: LOCAL
      GRATE_OUTPUT: /tmp/grate
    entrypoint: ["bash", "-c", "dotnet tool restore && bash db/grate.sh migrate"]
    depends_on:
      sqlserver:
        condition: service_healthy

  permify:
    image: ghcr.io/permify/permify:v1.7.5
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: "postgres://permify:permify@permify-db:5432/permify?sslmode=disable"
      PERMIFY_DATABASE_AUTO_MIGRATE: "true"
    ports:
      - "3476:3476" # REST
      - "3478:3478" # gRPC
    depends_on:
      permify-db:
        condition: service_healthy

  permify-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: permify
      POSTGRES_PASSWORD: permify
      POSTGRES_DB: permify
    volumes:
      - permify-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permify"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  sqlserver-data:
  permify-data:
